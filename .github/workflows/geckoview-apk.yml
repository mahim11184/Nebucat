name: Build Nebucat GeckoView APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/geckoview-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build standalone GeckoView browser
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Nebucat
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.0"

      - name: Build standalone GeckoView APK
        run: gradle -p android --no-daemon clean assembleDebug

      - name: Verify APK exists and signature
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify "$APK"
          ls -lh "$APK"
          sha256sum "$APK" > android/app/build/outputs/apk/debug/SHA256SUMS

      - name: Upload standalone Nebucat APK
        uses: actions/upload-artifact@v4
        with:
          name: nebucat-geckoview-android-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
