name: Build Niobium Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build GeckoView APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform required by GeckoView
        run: |
          sdkmanager --channel=3 "platforms;android-37.2" "build-tools;37.0.0"
          # AGP compileSdk 37 resolves the android-37 directory.
          # Point it at the 37.2 platform so GeckoView's minCompileSdk 37.2 is met.
          if [ -d "$ANDROID_HOME/platforms/android-37.2" ]; then
            rm -rf "$ANDROID_HOME/platforms/android-37"
            ln -s android-37.2 "$ANDROID_HOME/platforms/android-37"
          fi
          ls -la "$ANDROID_HOME/platforms"

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.5.0-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-9.5.0/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: gradle --no-daemon -p android clean assembleDebug

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: niobium-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
