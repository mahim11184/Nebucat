name: Build Niobium Android APK

on:
  push:
    branches: [main]
    paths:
      - "mozilla-firefox"
      - ".gitmodules"
      - ".github/workflows/android-apk.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Niobium from Mozilla Firefox for Android
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Niobium and Mozilla source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Mozilla Android SDK requirements
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$ANDROID_HOME" >> mozilla-firefox/fenix/local.properties

      - name: Rebrand Mozilla Fenix as Niobium
        working-directory: mozilla-firefox/fenix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/build.gradle")
          s = p.read_text()
          s, n = re.subn(r'applicationId\s+"org\.mozilla"', 'applicationId "com.mahim11184.niobium"', s, count=1)
          if n != 1:
              raise SystemExit("Could not safely locate Mozilla Fenix applicationId")
          s = s.replace('applicationIdSuffix ".fenix.debug"', 'applicationIdSuffix ".debug"', 1)
          p.write_text(s)
          found = False
          for f in Path("app/src").rglob("strings.xml"):
              t = f.read_text(errors="ignore")
              new, count = re.subn(r'(<string\s+name="app_name"[^>]*>)Firefox(</string>)', r'\1Niobium\2', t, count=1)
              if count:
                  f.write_text(new)
                  found = True
          if not found:
              print("Warning: app_name was not an exact Firefox string; package will still be Niobium")
          PY
          printf '\nautosignReleaseWithDebugKey=\n' >> local.properties
          grep -n 'applicationId' app/build.gradle | head

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Niobium debug APKs
        working-directory: mozilla-firefox/fenix
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx5g -Xms1g -XX:MaxMetaspaceSize=3g"
        run: |
          ./gradlew clean app:assembleDebug --stacktrace --no-daemon
          find app/build/outputs/apk -type f -name '*.apk' -ls

      - name: Verify APK output
        working-directory: mozilla-firefox/fenix
        run: |
          test -n "$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"

      - name: Upload Niobium APKs
        uses: actions/upload-artifact@v4
        with:
          name: niobium-mozilla-firefox-android-apks
          path: mozilla-firefox/fenix/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
