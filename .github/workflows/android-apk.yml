name: Build Niobium Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "iceraven"
      - ".gitmodules"
      - ".github/workflows/android-apk.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Niobium from Iceraven (Firefox for Android)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Niobium and official Iceraven source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Iceraven Android SDK requirements
        working-directory: iceraven
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;29.0.14206865"
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Apply Iceraven Android Components patches
        working-directory: iceraven
        run: |
          chmod +x automation/iceraven/patch_android_components.sh automation/iceraven/setup_venv.sh
          automation/iceraven/patch_android_components.sh
          automation/iceraven/setup_venv.sh

      - name: Rebrand Iceraven as Niobium
        working-directory: iceraven
        run: |
          # Keep upstream browser code and GeckoView intact; change the visible product identity.
          find app/src -type f -path '*/res/values*/*strings.xml' -print0 | xargs -0 sed -i 's/Iceraven/Niobium/g; s/iceraven/Niobium/g; s/Firefox/Niobium/g'
          sed -i 's/applicationId "io.github.forkmaintainers"/applicationId "com.mahim11184.niobium"/' app/build.gradle
          printf '\nautosignReleaseWithDebugKey=\n' >> local.properties
          grep -n 'applicationId' app/build.gradle
          grep -R -n 'app_name' app/src/*/res/values* 2>/dev/null | head -20 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Niobium release APKs
        working-directory: iceraven
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=4g -Xms1g -Xmx7g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dev/stderr"
        run: |
          ./gradlew app:assembleForkRelease -PversionName=0.3.0 --stacktrace --no-daemon
          find gradle/build/app/outputs/apk -type f -name '*.apk' -ls

      - name: Verify APK output
        working-directory: iceraven
        run: |
          test -n "$(find gradle/build/app/outputs/apk -type f -name '*.apk' -print -quit)"

      - name: Upload installable APKs
        uses: actions/upload-artifact@v4
        with:
          name: niobium-0.3.0-iceraven-apks
          path: iceraven/gradle/build/app/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
