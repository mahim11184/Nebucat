name: Build Niobium Android APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-apk.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Niobium from Mozilla Central (GeckoView)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Niobium
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Clone official Mozilla Firefox source
        run: |
          git clone --depth 1 https://github.com/mozilla-firefox/firefox.git mozilla-firefox
          test -x mozilla-firefox/mach
          test -d mozilla-firefox/mobile/android/fenix/app

      - name: Bootstrap Mozilla Central for Android (artifact mode)
        working-directory: mozilla-firefox
        run: |
          ./mach --no-interactive bootstrap --application-choice="GeckoView/Firefox for Android Artifact Mode"

      - name: Rebrand Fenix as Niobium
        working-directory: mozilla-firefox
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("mobile/android/fenix/app/build.gradle")
          source = gradle.read_text()
          source, count = re.subn(
              r'applicationId\s+"org\.mozilla"',
              'applicationId "com.mahim11184.niobium"',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not safely locate the upstream Fenix applicationId")
          source, count = re.subn(
              r'applicationIdSuffix\s+"\.fenix\.debug"',
              'applicationIdSuffix ".debug"',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not safely locate the Fenix debug applicationIdSuffix")
          gradle.write_text(source)

          resources = Path("mobile/android/fenix/app/src/main/res")
          renamed = 0
          for xml in resources.rglob("*.xml"):
              try:
                  content = xml.read_text()
              except (UnicodeDecodeError, OSError):
                  continue
              updated, hits = re.subn(
                  r'(<string\s+name="app_name"[^>]*>)\s*[^<]+\s*(</string>)',
                  r'\1Niobium\2',
                  content,
              )
              if hits:
                  xml.write_text(updated)
                  renamed += hits
          if not renamed:
              raise SystemExit("Could not find the upstream app_name resource")
          print(f"Updated {renamed} app-name resource(s)")
          PY

      - name: Build GeckoView and Android frontend
        working-directory: mozilla-firefox
        env:
          MOZBUILD_STATE_PATH: ${{ runner.temp }}/mozbuild
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx5g -Xms1g -XX:MaxMetaspaceSize=2g"
        run: |
          ./mach build
          ./mach gradle --no-daemon fenix:assembleDebug

      - name: Collect and verify APKs
        run: |
          mkdir -p "${RUNNER_TEMP}/niobium-apks"
          find mozilla-firefox -type f -path '*/fenix/app/outputs/apk/*' -name '*.apk' -print -exec cp {} "${RUNNER_TEMP}/niobium-apks/" \;
          test -n "$(find "${RUNNER_TEMP}/niobium-apks" -type f -name '*.apk' -print -quit)"
          ls -lh "${RUNNER_TEMP}/niobium-apks"

      - name: Upload Niobium APKs
        uses: actions/upload-artifact@v4
        with:
          name: niobium-mozilla-central-android-apks
          path: ${{ runner.temp }}/niobium-apks/*.apk
          if-no-files-found: error
          retention-days: 30
