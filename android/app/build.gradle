plugins {
    id "com.android.application"
}

android {
    namespace "com.mahim11184.niobium"
    compileSdk 37

    defaultConfig {
        applicationId "com.mahim11184.niobium"
        minSdk 29
        targetSdk 35
        versionCode 3
        versionName "0.3.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += [
                "META-INF/DEPENDENCIES",
                "META-INF/LICENSE*",
                "META-INF/NOTICE*"
            ]
        }
    }
}

dependencies {
    // Stable Mozilla GeckoView engine. See Mozilla's GeckoView quick-start.
    implementation "org.mozilla.geckoview:geckoview:160.0.20261116130455"
}
